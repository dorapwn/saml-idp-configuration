<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="Inter, system-ui, sans-serif">
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">IDP Admin Console — New SAML App</text>

  <!-- Outer panel: IDP Admin Console -->
  <rect x="20" y="40" width="480" height="400" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="20" y="40" width="480" height="28" rx="10" fill="#1e40af"/>
  <rect x="20" y="56" width="480" height="12" fill="#1e40af"/>
  <text x="40" y="59" font-size="12" font-weight="600" fill="#ffffff">IDP Admin Console</text>
  <!-- traffic dots -->
  <circle cx="468" cy="54" r="4" fill="#fbbf24"/>
  <circle cx="480" cy="54" r="4" fill="#34d399"/>
  <circle cx="492" cy="54" r="4" fill="#f87171"/>

  <!-- App panel -->
  <rect x="50" y="92" width="420" height="200" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="50" y="92" width="420" height="24" rx="8" fill="#dbeafe"/>
  <rect x="50" y="108" width="420" height="8" fill="#dbeafe"/>
  <text x="64" y="109" font-size="11" font-weight="600" fill="#1e40af">+ New App — SAML 2.0</text>

  <!-- App config rows -->
  <g font-size="11" fill="#0f172a">
    <rect x="70" y="132" width="380" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="80" y="148" fill="#475569">ACS URL</text>
    <text x="160" y="148" font-family="ui-monospace, monospace" fill="#1e40af">https://hr.acme.com/saml/acs</text>

    <rect x="70" y="162" width="380" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="80" y="178" fill="#475569">EntityID</text>
    <text x="160" y="178" font-family="ui-monospace, monospace" fill="#1e40af">https://hr.acme.com</text>

    <rect x="70" y="192" width="380" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="80" y="208" fill="#475569">NameID</text>
    <text x="160" y="208" font-family="ui-monospace, monospace" fill="#1e40af">persistent</text>

    <rect x="70" y="222" width="380" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="80" y="238" fill="#475569">Attrs...</text>
    <text x="160" y="238" font-family="ui-monospace, monospace" fill="#0ea5e9">email, groups, role</text>

    <rect x="70" y="252" width="380" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="80" y="268" fill="#166534" font-weight="600">✓ Save and assign users</text>
  </g>

  <!-- Users panel -->
  <rect x="50" y="312" width="420" height="100" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="50" y="312" width="420" height="24" rx="8" fill="#e0f2fe"/>
  <rect x="50" y="328" width="420" height="8" fill="#e0f2fe"/>
  <text x="64" y="329" font-size="11" font-weight="600" fill="#0369a1">Users &amp; Groups assigned</text>

  <!-- User rows -->
  <g font-size="11" fill="#0f172a">
    <rect x="70" y="346" width="380" height="18" rx="3" fill="#f8fafc"/>
    <text x="78" y="359">👤 alice@acme.com</text>
    <text x="436" y="359" text-anchor="end" font-size="10" fill="#16a34a">admin</text>

    <rect x="70" y="368" width="380" height="18" rx="3" fill="#f8fafc"/>
    <text x="78" y="381">👤 bob@acme.com</text>
    <text x="436" y="381" text-anchor="end" font-size="10" fill="#0ea5e9">engineering</text>

    <rect x="70" y="390" width="380" height="18" rx="3" fill="#f8fafc"/>
    <text x="78" y="403">👥 sso-acme-hr-users</text>
    <text x="436" y="403" text-anchor="end" font-size="10" fill="#64748b">18 members</text>
  </g>
</svg>
