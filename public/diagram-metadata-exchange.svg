<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif">
  <text x="450" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Metadata Exchange — Day 0 vs Cert Rotation</text>

  <defs>
    <marker id="seq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
    <marker id="seq-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Two actors: IDP (with embedded admin role) and SP -->
  <g font-size="13" font-weight="600" fill="#0f172a">
    <!-- IDP group -->
    <rect x="120" y="50" width="280" height="40" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="260" y="75" text-anchor="middle">Identity Provider (IDP Admin)</text>

    <!-- SP group -->
    <rect x="500" y="50" width="280" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="640" y="75" text-anchor="middle">Service Provider</text>
  </g>

  <!-- Lifelines -->
  <line x1="260" y1="90" x2="260" y2="440" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="640" y1="90" x2="640" y2="440" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Day 0 phase -->
  <rect x="120" y="105" width="660" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Day 0: Initial setup (one-time, both sides)</text>

  <!-- Local admin task: IDP side -->
  <rect x="150" y="148" width="220" height="36" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-dasharray="3 3"/>
  <text x="260" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">👤 IDP Admin (local)</text>
  <text x="260" y="177" text-anchor="middle" font-size="10" fill="#1e3a8a">registers new SP app in console</text>

  <!-- Local admin task: SP side -->
  <rect x="530" y="148" width="220" height="36" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="3 3"/>
  <text x="640" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">👤 SP Admin (local)</text>
  <text x="640" y="177" text-anchor="middle" font-size="10" fill="#475569">configures IDP connection</text>

  <!-- Wire message 1: IDP -> SP: IDP metadata -->
  <line x1="260" y1="210" x2="640" y2="210" stroke="#1e40af" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="450" y="203" text-anchor="middle" font-size="11" fill="#1e40af">publish / share IDP metadata (XML)</text>

  <!-- Wire message 2: SP -> IDP: SP metadata -->
  <line x1="640" y1="240" x2="260" y2="240" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#seq-dash)"/>
  <text x="450" y="233" text-anchor="middle" font-size="11" fill="#0369a1">share SP metadata (XML) back</text>

  <!-- Note: verify -->
  <rect x="260" y="258" width="380" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="276" text-anchor="middle" font-size="11" font-style="italic" fill="#166534">Both sides parse, verify signatures, pin fingerprints</text>

  <!-- Day N phase -->
  <rect x="120" y="300" width="660" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Day N: Cert rotation (no re-onboarding)</text>

  <!-- Wire: IDP publishes new metadata -->
  <line x1="260" y1="345" x2="640" y2="345" stroke="#1e40af" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#1e40af">publish new IDP metadata at stable URL</text>

  <!-- Wire: SP acknowledges -->
  <line x1="640" y1="375" x2="260" y2="375" stroke="#1e40af" stroke-width="1.5" marker-end="url(#seq-arr)"/>
  <text x="450" y="368" text-anchor="middle" font-size="11" fill="#1e40af">SP picks up new cert (no SP-side change yet)</text>

  <!-- Note: overlap window -->
  <rect x="260" y="395" width="380" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="413" text-anchor="middle" font-size="11" font-style="italic" fill="#166534">Overlap window: both certs valid for ≥ 2 weeks</text>

  <!-- Legend -->
  <g font-size="10" fill="#475569">
    <line x1="120" y1="450" x2="145" y2="450" stroke="#1e40af" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="152" y="453">new metadata</text>
    <line x1="270" y1="450" x2="295" y2="450" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#seq-dash)"/>
    <text x="302" y="453">return / upload</text>
    <rect x="400" y="445" width="12" height="10" fill="#dbeafe" stroke="#1e40af" stroke-dasharray="3 3"/>
    <text x="418" y="453">local admin task (off-wire)</text>
  </g>
</svg>
