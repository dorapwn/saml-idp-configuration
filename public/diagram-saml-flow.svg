<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Inter, system-ui, sans-serif">
  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">SP-Initiated SSO — Numbered Message Flow</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Three actors -->
  <!-- SP -->
  <g>
    <rect x="40" y="60" width="140" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="110" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Service</text>
    <text x="110" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Provider</text>
    <text x="110" y="126" text-anchor="middle" font-size="11" fill="#475569">(SP)</text>
  </g>

  <!-- IDP -->
  <g>
    <rect x="290" y="60" width="140" height="80" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="360" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#0369a1">Identity</text>
    <text x="360" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#0369a1">Provider</text>
    <text x="360" y="126" text-anchor="middle" font-size="11" fill="#475569">(IDP)</text>
  </g>

  <!-- User -->
  <g>
    <rect x="540" y="60" width="140" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="610" cy="84" r="12" fill="#cbd5e1"/>
    <path d="M 592 110 Q 610 92 628 110 Z" fill="#cbd5e1"/>
    <text x="610" y="130" text-anchor="middle" font-size="11" fill="#475569">End User</text>
  </g>

  <!-- Arrows -->
  <!-- ① SP -> IDP: AuthnRequest -->
  <line x1="180" y1="88" x2="288" y2="88" stroke="#1e40af" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <text x="234" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">① AuthnRequest</text>

  <!-- ② IDP -> User: Assertion -->
  <line x1="430" y1="100" x2="538" y2="100" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr-back)"/>
  <text x="484" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">② Assertion</text>

  <!-- ③ IDP -> SP: Redirect with SAMLResponse -->
  <line x1="290" y1="124" x2="182" y2="124" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr-back)"/>
  <text x="236" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">③ Redirect w/ SAMLResponse</text>

  <!-- ④ User -> IDP: SAML Response -->
  <line x1="540" y1="112" x2="432" y2="112" stroke="#1e40af" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <text x="486" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">④ User authenticated</text>

  <!-- Bottom note -->
  <rect x="80" y="180" width="560" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="205" text-anchor="middle" font-size="12" fill="#78350f">User authenticates at the IDP; SP never sees a password — it trusts the signed assertion only.</text>
</svg>
