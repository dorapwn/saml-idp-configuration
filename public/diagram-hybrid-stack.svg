<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Inter, system-ui, sans-serif">
  <text x="490" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Hybrid Identity Stack — SAML + OIDC + SCIM</text>

  <defs>
    <marker id="hy-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
    <marker id="hy-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- User -->
  <g>
    <rect x="380" y="50" width="220" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="490" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">👤 End User</text>
    <text x="490" y="96" text-anchor="middle" font-size="11" fill="#92400e">browser / mobile / API client</text>
  </g>

  <!-- IDP cluster -->
  <rect x="60" y="160" width="380" height="380" rx="12" fill="#eff6ff" stroke="#1e40af" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="60" y="160" width="380" height="32" rx="12" fill="#1e40af"/>
  <rect x="60" y="180" width="380" height="12" fill="#1e40af"/>
  <text x="78" y="181" font-size="13" font-weight="600" fill="#ffffff">Identity Provider (Okta / Entra ID / Keycloak)</text>

  <g font-size="12" fill="#0f172a">
    <rect x="90"  y="220" width="320" height="50" rx="6" fill="#dbeafe" stroke="#1e40af"/>
    <text x="250" y="240" text-anchor="middle" font-weight="600" fill="#1e40af">SAML 2.0 Endpoint</text>
    <text x="250" y="258" text-anchor="middle" font-size="11" fill="#1e3a8a">AuthnRequest · Assertion · HTTP-POST/Redirect</text>

    <rect x="90"  y="290" width="320" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="250" y="310" text-anchor="middle" font-weight="600" fill="#0369a1">OIDC / OAuth 2.0</text>
    <text x="250" y="328" text-anchor="middle" font-size="11" fill="#0c4a6e">ID Token · Access Token · Refresh Token</text>

    <rect x="90"  y="360" width="320" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6"/>
    <text x="250" y="380" text-anchor="middle" font-weight="600" fill="#0f766e">SCIM 2.0</text>
    <text x="250" y="398" text-anchor="middle" font-size="11" fill="#115e59">User / Group CRUD · provisioning lifecycle</text>

    <rect x="90"  y="430" width="320" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="250" y="450" text-anchor="middle" font-weight="600" fill="#5b21b6">🔐 MFA / WebAuthn</text>
    <text x="250" y="468" text-anchor="middle" font-size="11" fill="#6b21a8">Step-up auth · passkeys · TOTP</text>
  </g>

  <!-- SP cluster -->
  <rect x="540" y="160" width="380" height="380" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="540" y="160" width="380" height="32" rx="12" fill="#475569"/>
  <rect x="540" y="180" width="380" height="12" fill="#475569"/>
  <text x="558" y="181" font-size="13" font-weight="600" fill="#ffffff">Service Providers</text>

  <g font-size="12" fill="#0f172a">
    <rect x="570" y="220" width="160" height="80" rx="6" fill="#dbeafe" stroke="#1e40af"/>
    <text x="650" y="242" text-anchor="middle" font-weight="600" fill="#1e40af">Legacy ERP</text>
    <text x="650" y="260" text-anchor="middle" font-size="10" fill="#1e3a8a">SAML</text>
    <text x="650" y="280" text-anchor="middle" font-size="10" fill="#475569">Shibboleth 2.x</text>

    <rect x="740" y="220" width="160" height="80" rx="6" fill="#dbeafe" stroke="#1e40af"/>
    <text x="820" y="242" text-anchor="middle" font-weight="600" fill="#1e40af">Modern SaaS</text>
    <text x="820" y="260" text-anchor="middle" font-size="10" fill="#1e3a8a">SAML</text>
    <text x="820" y="280" text-anchor="middle" font-size="10" fill="#475569">Salesforce, GitHub</text>

    <rect x="570" y="320" width="160" height="80" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="650" y="342" text-anchor="middle" font-weight="600" fill="#0369a1">Mobile App</text>
    <text x="650" y="360" text-anchor="middle" font-size="10" fill="#0c4a6e">OIDC</text>
    <text x="650" y="380" text-anchor="middle" font-size="10" fill="#475569">PKCE + AppLinks</text>

    <rect x="740" y="320" width="160" height="80" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="820" y="342" text-anchor="middle" font-weight="600" fill="#0369a1">Internal API</text>
    <text x="820" y="360" text-anchor="middle" font-size="10" fill="#0c4a6e">OIDC + JWT</text>
    <text x="820" y="380" text-anchor="middle" font-size="10" fill="#475569">Bearer tokens</text>

    <rect x="570" y="430" width="330" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="735" y="454" text-anchor="middle" font-weight="600" fill="#78350f">SCIM-managed user lifecycle</text>
    <text x="735" y="472" text-anchor="middle" font-size="10" fill="#92400e">provisioning / deprovisioning for all SPs above</text>
  </g>

  <!-- Edges -->
  <line x1="490" y1="110" x2="490" y2="160" stroke="#1e40af" stroke-width="2" marker-end="url(#hy-arr)"/>
  <text x="500" y="138" font-size="11" fill="#1e40af">Login</text>

  <line x1="250" y1="270" x2="650" y2="220" stroke="#1e40af" stroke-width="1.5" marker-end="url(#hy-arr)"/>
  <text x="450" y="240" font-size="10" fill="#1e40af">Assertion</text>

  <line x1="250" y1="270" x2="820" y2="220" stroke="#1e40af" stroke-width="1.5" marker-end="url(#hy-arr)"/>
  <text x="540" y="240" font-size="10" fill="#1e40af">Assertion</text>

  <line x1="250" y1="340" x2="650" y2="320" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#hy-arr)"/>
  <text x="430" y="325" font-size="10" fill="#0369a1">ID Token</text>

  <line x1="250" y1="340" x2="820" y2="320" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#hy-arr)"/>
  <text x="540" y="325" font-size="10" fill="#0369a1">Access Token</text>

  <!-- SCIM provisioning (dashed) -->
  <path d="M 250 410 Q 490 460 735 430" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#hy-dash)"/>
  <text x="490" y="478" text-anchor="middle" font-size="10" fill="#0f766e">SCIM 2.0 — user/group CRUD</text>

  <!-- MFA note -->
  <path d="M 320 460 Q 270 470 230 455" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#hy-arr)"/>
  <text x="240" y="490" font-size="10" fill="#5b21b6">MFA enforced</text>
</svg>
